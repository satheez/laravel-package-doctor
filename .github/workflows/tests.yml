name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        # Laravel 11 and 12 require Guzzle 7. The default cells stay there.
        # Laravel 13 allows Guzzle 7 or 8; the extra include rows resolve 8.
        guzzle: ['^7.8']
        include:
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
            guzzle: '^8.0'
          - php: '8.5'
            laravel: '13.*'
            testbench: '^11.0'
            guzzle: '^8.0'
        exclude:
          # Laravel 13 requires PHP 8.3+.
          - php: '8.2'
            laravel: '13.*'
          # Laravel 11 supports PHP 8.2–8.4 only.
          - php: '8.5'
            laravel: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Guzzle ${{ matrix.guzzle }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, curl, zip
          coverage: none
          tools: composer

      - name: Install dependencies
        run: |
          # Laravel 11 is outside security support. Composer blocks every 11.x
          # release, so this job cannot install the declared range unless
          # advisory blocking is turned off for that cell only.
          if [ "${{ matrix.laravel }}" = "11.*" ]; then
            composer config policy.advisories.block false
          fi
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Verify resolved Guzzle version
        run: |
          version="$(composer show guzzlehttp/guzzle --format=json | php -r '$package = json_decode(stream_get_contents(STDIN)); echo $package->versions[0] ?? $package->version ?? "";')"
          echo "Resolved guzzlehttp/guzzle ${version} for constraint ${{ matrix.guzzle }}"
          case "${{ matrix.guzzle }}" in
            ^8*) expected=8. ;;
            *) expected=7. ;;
          esac
          case "$version" in
            ${expected}*) ;;
            *)
              echo "Expected Guzzle ${expected}x, resolved ${version}" >&2
              exit 1
              ;;
          esac

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run Rector
        run: vendor/bin/rector process --dry-run

      - name: Run tests
        run: vendor/bin/pest

      - name: Run static analysis
        run: vendor/bin/phpstan analyse
        continue-on-error: true
