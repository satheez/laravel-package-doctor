name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, curl, zip
          coverage: none
          tools: composer

      - name: Install dependencies
        run: |
          # Laravel 11 is outside security support. Composer blocks every 11.x
          # release, so this job cannot install the declared range unless
          # advisory blocking is turned off for that cell only.
          if [ "${{ matrix.laravel }}" = "11.*" ]; then
            composer config policy.advisories.block false
          fi
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run Rector
        run: vendor/bin/rector process --dry-run

      - name: Run tests
        run: vendor/bin/pest

      - name: Run static analysis
        run: vendor/bin/phpstan analyse
        continue-on-error: true
